<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Cuadre</title>
<meta name="wyt-app" content="ok">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cuadre">
<meta name="theme-color" content="#1a1f2b">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<style>
  :root {
    --bg: #1a1f2b;          /* azul pizarra oscuro, suave a la vista */
    --surface: #232a38;
    --surface-2: #2c3445;
    --text: #e6e8ee;
    --muted: #8a93a6;
    --green: #5fbf6a;
    --green-soft: rgba(95,191,106,.16);
    --red: #e0574f;
    --red-soft: rgba(224,87,79,.16);
    --safe-top: env(safe-area-inset-top);
    --safe-bottom: env(safe-area-inset-bottom);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
    color: var(--text); overflow: hidden;
    -webkit-user-select: none; user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }
  [hidden] { display: none !important; }

  /* ---------- Vistas ---------- */
  .view {
    position: fixed; inset: 0; background: var(--bg);
    padding: calc(var(--safe-top) + 20px) 22px calc(var(--safe-bottom) + 16px);
    display: flex; flex-direction: column;
    transition: transform .35s cubic-bezier(.2,.8,.2,1), opacity .35s;
  }
  #movimientos, #deudas { transform: translateX(100%); }
  #movimientos.on, #deudas.on { transform: translateX(0); }
  #inicio.off { transform: translateX(-25%); opacity: .4; }

  /* ---------- Inicio ---------- */
  .acciones { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 10px; }
  .pill {
    border: 0; border-radius: 999px; height: 62px;
    font-size: 21px; font-weight: 600; color: #fff;
    transition: transform .1s, filter .1s;
  }
  .pill:active { transform: scale(.96); filter: brightness(.92); }
  .pill.ingreso { background: var(--green); }
  .pill.gasto { background: var(--red); }

  .balance { text-align: center; margin-top: 30px; width: 100%; }
  .balance .label { font-size: 16px; color: var(--muted); letter-spacing: .3px; }
  .monto-wrap { width: 100%; height: 92px; display: flex; align-items: center; justify-content: center; overflow: hidden; margin-top: 2px; }
  .balance .monto {
    display: inline-block; white-space: nowrap;
    font-size: 84px; font-weight: 700; letter-spacing: -0.03em;
    line-height: 1; font-variant-numeric: tabular-nums;
    transition: color .3s;
  }
  .pos { color: var(--green); }
  .neg { color: var(--red); }

  .barras {
    flex: 1; min-height: 160px; margin-top: 26px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  .col { display: flex; flex-direction: column; align-items: center; min-height: 0; min-width: 0; }
  /* La barra vive dentro de su "pista" y nunca puede salir de ella */
  .pista { flex: 1; width: 100%; position: relative; min-height: 0; overflow: hidden; }
  .barra {
    position: absolute; bottom: 0; left: 50%; transform: translateX(-50%);
    width: min(118px, 64%); border-radius: 999px; min-height: 26px; height: 0%; max-height: 100%;
    transition: height .6s cubic-bezier(.2,.8,.2,1);
  }
  .col.ingreso .barra { background: var(--green); }
  .col.gasto .barra { background: var(--red); }
  .total-wrap { width: 100%; height: 30px; margin-top: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .total { display: inline-block; white-space: nowrap; font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .col .sub { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .links { display: flex; justify-content: center; gap: 2px; margin: 18px auto 4px; }
  .link-mov {
    margin: 0; background: none; border: 0; color: var(--text);
    font-size: 19px; font-weight: 500; padding: 12px 18px; border-radius: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .link-mov:active { background: var(--surface); }

  /* ---------- Movimientos ---------- */
  .top { display: flex; align-items: center; gap: 6px; margin: -6px 0 16px -8px; }
  .back { background: none; border: 0; color: var(--text); font-size: 17px; padding: 8px; display: flex; align-items: center; gap: 2px; }
  .top h2 { font-size: 28px; font-weight: 700; margin-left: 8px; }
  .lista { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -22px; padding: 0 22px 20px; }
  .item {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border-radius: 16px; padding: 14px 16px; margin-bottom: 10px;
  }
  .item:active { background: var(--surface-2); }
  .tag {
    font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 999px; flex-shrink: 0;
  }
  .tag.ingreso { background: var(--green-soft); color: var(--green); }
  .tag.gasto { background: var(--red-soft); color: var(--red); }
  .item .info { flex: 1; min-width: 0; }
  .item .nombre { font-size: 16px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .fecha { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .item .valor { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; flex-shrink: 0; white-space: nowrap; }
  .item .info { overflow: hidden; }
  .item .meta { display: flex; align-items: center; gap: 8px; margin-top: 5px; min-width: 0; }
  .item .meta .tag { font-size: 11px; padding: 3px 8px; }
  .item .meta .fecha { margin-top: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .item { padding-right: 8px; }
  .borrar {
    flex-shrink: 0; width: 40px; height: 40px; border: 0; border-radius: 12px;
    background: transparent; color: var(--muted); display: grid; place-items: center;
  }
  .borrar:active { background: var(--red-soft); color: var(--red); }
  .aviso {
    background: var(--red-soft); color: #f0a29c; border-radius: 12px;
    padding: 12px 14px; font-size: 14px; line-height: 1.4; margin: -6px 0 18px;
  }
  .toast {
    position: fixed; left: 50%; bottom: calc(var(--safe-bottom) + 24px); z-index: 20;
    transform: translate(-50%, 140%); opacity: 0;
    background: var(--surface-2); color: var(--text); font-size: 15px; font-weight: 500;
    padding: 12px 20px; border-radius: 999px; transition: transform .3s, opacity .3s;
    box-shadow: 0 8px 24px rgba(0,0,0,.35); white-space: nowrap;
  }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }
  .vacio { text-align: center; color: var(--muted); margin-top: 30%; font-size: 16px; line-height: 1.5; }

  /* ---------- Deudas ---------- */
  .pill.debo { background: var(--red); }
  .pill.medeben { background: var(--green); }
  #deudas .acciones { margin-top: 12px; }
  .segmento.dos { grid-template-columns: repeat(2, 1fr); }
  .segmento.dos .indicador { width: calc((100% - 8px) / 2); }
  .segmento[data-t="cerradas"] .indicador { transform: translateX(100%); }
  .item.deuda .persona .estado { color: var(--muted); }
  .item.deuda.cerrada .valor { opacity: .75; }
  .seccion .cuenta { font-size: 13px; font-weight: 600; letter-spacing: .3px; text-transform: none; color: var(--muted); }
  #detDeudaGasto .campo { margin-bottom: 4px; }
  .lista-deudas { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 14px -22px 0; padding: 0 22px 20px; }
  .seccion {
    display: flex; align-items: baseline; justify-content: space-between;
    margin: 14px 4px 10px; font-size: 13px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase; color: var(--muted);
  }
  .seccion b { font-size: 17px; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }
  .item.deuda .persona { display: flex; align-items: center; gap: 5px; font-size: 13px; color: var(--muted); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item.deuda .persona svg { flex-shrink: 0; }
  .item.deuda .chev { color: var(--muted); flex-shrink: 0; margin-left: -4px; }
  .vacio-sec { color: var(--muted); font-size: 14px; padding: 14px 16px; border: 1.5px dashed var(--surface-2); border-radius: 16px; text-align: center; }
  .info-deuda { font-size: 13px; color: var(--muted); margin: 2px 0 14px 4px; line-height: 1.4; }
  .fichas { background: var(--bg); border-radius: 16px; padding: 4px 16px; margin: -4px 0 16px; }
  .ficha { display: flex; justify-content: space-between; gap: 12px; padding: 11px 0; font-size: 15px; }
  .ficha + .ficha { border-top: 1px solid var(--surface-2); }
  .ficha span { color: var(--muted); }
  .ficha b { font-weight: 600; text-align: right; overflow-wrap: anywhere; }
  .aviso.ok { background: var(--surface-2); color: var(--text); }
  .btn.borrar-deuda { background: transparent; color: var(--red); }
  .acciones-deuda { display: grid; gap: 10px; }
  .acciones-deuda .fila { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ---------- Filtros ---------- */
  .segmento {
    position: relative; display: grid; grid-template-columns: repeat(3, 1fr);
    background: var(--surface); border-radius: 14px; padding: 4px; margin-bottom: 4px;
  }
  .segmento button {
    position: relative; z-index: 1; border: 0; background: none; color: var(--muted);
    height: 38px; font-size: 15px; font-weight: 600; border-radius: 10px; transition: color .25s;
  }
  .segmento button.on { color: var(--text); }
  .segmento button.on[data-t="ingreso"] { color: var(--green); }
  .segmento button.on[data-t="gasto"] { color: var(--red); }
  .segmento .indicador {
    position: absolute; top: 4px; bottom: 4px; left: 4px; width: calc((100% - 8px) / 3);
    border-radius: 10px; background: var(--surface-2);
    transition: transform .3s cubic-bezier(.2,.8,.2,1), background .3s;
  }
  .segmento[data-t="ingreso"] .indicador { transform: translateX(100%); background: var(--green-soft); }
  .segmento[data-t="gasto"] .indicador { transform: translateX(200%); background: var(--red-soft); }

  .chips-wrap { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .3s ease, margin .3s; margin: 0 -22px; }
  .chips-wrap.on { grid-template-rows: 1fr; margin-top: 8px; margin-bottom: 4px; }
  .chips-wrap > div { overflow: hidden; }
  .chips {
    display: flex; gap: 8px; overflow-x: auto; padding: 2px 22px 8px; scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0; border: 1.5px solid var(--surface-2); background: transparent; color: var(--text);
    height: 36px; padding: 0 14px; border-radius: 999px; font-size: 14.5px; font-weight: 500;
    display: flex; align-items: center; gap: 7px; transition: background .2s, border-color .2s, color .2s;
  }
  .chip .n { font-size: 12px; font-weight: 600; color: var(--muted); }
  .chip:active { transform: scale(.96); }
  .chips.ingreso .chip.on { background: var(--green); border-color: var(--green); color: #fff; }
  .chips.gasto .chip.on { background: var(--red); border-color: var(--red); color: #fff; }
  .chip.on .n { color: rgba(255,255,255,.8); }
  .chip.cero { opacity: .45; }

  .lista-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; margin-top: 10px; }
  .resumen {
    display: flex; align-items: center; gap: 12px; margin: 0 -6px;
    background: var(--surface); border-radius: 18px; padding: 14px 18px;
    transform: translateY(20px); opacity: 0; max-height: 0; overflow: hidden; padding-top: 0; padding-bottom: 0;
    transition: all .3s cubic-bezier(.2,.8,.2,1);
  }
  .resumen.on { transform: none; opacity: 1; max-height: 90px; padding-top: 14px; padding-bottom: 14px; margin-top: 8px; }
  .resumen .txt { flex: 1; min-width: 0; }
  .resumen .txt b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .resumen .txt small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; }
  .resumen .monto-res { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .resumen.ingreso { box-shadow: inset 4px 0 0 var(--green); }
  .resumen.gasto { box-shadow: inset 4px 0 0 var(--red); }

  /* ---------- Hoja inferior (formulario) ---------- */
  .velo {
    position: fixed; inset: 0; background: rgba(5,8,14,.55);
    opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 10;
  }
  .velo.on { opacity: 1; pointer-events: auto; }
  .hoja {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 11;
    background: var(--surface); border-radius: 24px 24px 0 0;
    padding: 10px 22px calc(var(--safe-bottom) + 22px);
    transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1);
  }
  .hoja.on { transform: translateY(0); }
  .agarre { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-2); margin: 0 auto 16px; }
  .hoja h3 { font-size: 22px; font-weight: 700; margin-bottom: 16px; }
  .campo { display: block; margin-bottom: 12px; }
  .campo span { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 4px; }
  .campo input {
    width: 100%; height: 54px; border-radius: 14px; border: 1.5px solid transparent;
    background: var(--bg); color: var(--text); padding: 0 16px;
    font-size: 18px; font-family: inherit; outline: none;
    -webkit-user-select: text; user-select: text;
  }
  .campo input:focus { border-color: var(--muted); }
  .campo .opc { font-style: normal; opacity: .7; }
  .campo .opc.req { color: var(--red); opacity: 1; }
  .select-wrap { position: relative; }
  .select-wrap select {
    display: block; line-height: normal; text-align: left;
    width: 100%; height: 54px; border-radius: 14px; border: 1.5px solid transparent;
    background: var(--bg); color: var(--text); padding: 0 44px 0 16px;
    font-size: 18px; font-family: inherit; outline: none; -webkit-appearance: none; appearance: none;
  }
  .select-wrap select:focus { border-color: var(--muted); }
  .select-wrap select.sin-valor { color: var(--muted); }
  .select-wrap svg { position: absolute; right: 16px; top: 18px; color: var(--muted); pointer-events: none; }
  .pista-nombre { display: block; font-size: 12.5px; color: var(--muted); margin: 6px 0 0 4px; }
  .campo.monto input { font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .error { color: var(--red); font-size: 13px; min-height: 18px; margin: -4px 0 6px 4px; }
  .botones { display: grid; grid-template-columns: 1fr 1.6fr; gap: 10px; margin-top: 6px; }
  .btn { height: 54px; border: 0; border-radius: 14px; font-size: 17px; font-weight: 600; color: #fff; }
  .btn.sec { background: var(--surface-2); color: var(--text); }
  .btn.verde { background: var(--green); }
  .btn.rojo { background: var(--red); }
  .btn:active { filter: brightness(.9); }
  .hoja p.det { color: var(--muted); font-size: 15px; margin: -8px 0 18px; line-height: 1.4; }

  /* ---------- Respaldo ---------- */
  .btn-resp {
    margin-left: auto; background: var(--surface); border: 0; color: var(--text);
    font-size: 15px; font-weight: 500; padding: 9px 14px; border-radius: 999px;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-resp:active { background: var(--surface-2); }
  .opcion {
    width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
    background: var(--bg); border: 0; border-radius: 16px; padding: 16px; margin-bottom: 10px; color: var(--text);
  }
  .opcion:active { background: var(--surface-2); }
  .opcion .ico { width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center; flex-shrink: 0; }
  .opcion .ico.v { background: var(--green-soft); color: var(--green); }
  .opcion .ico.a { background: rgba(120,150,230,.16); color: #9db2f0; }
  .opcion b { display: block; font-size: 16px; font-weight: 600; }
  .opcion small { display: block; font-size: 13px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
  .ultimo { font-size: 13px; color: var(--muted); text-align: center; margin: 4px 0 14px; }
  .btn.full { width: 100%; }

  /* ---------- Aviso de nueva versión ---------- */
  .update {
    position: fixed; left: 16px; right: 16px; bottom: calc(var(--safe-bottom) + 14px); z-index: 30;
    background: var(--surface-2); border-radius: 16px; padding: 12px 12px 12px 16px;
    display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.4);
    transform: translateY(160%); transition: transform .35s cubic-bezier(.2,.8,.2,1);
  }
  .update.on { transform: translateY(0); }
  .update span { flex: 1; font-size: 15px; }
  .update button { border: 0; border-radius: 10px; background: var(--green); color: #fff; font-size: 15px; font-weight: 600; padding: 10px 14px; }
</style>
</head>
<body>

  <!-- ========== INICIO ========== -->
  <section class="view" id="inicio">
    <div class="acciones">
      <button class="pill ingreso" data-tipo="ingreso">Ingreso</button>
      <button class="pill gasto" data-tipo="gasto">Gasto</button>
    </div>

    <div class="balance">
      <div class="label" id="lblBalance">Ganancia</div>
      <div class="monto-wrap"><div class="monto pos" id="montoBalance">$0</div></div>
    </div>

    <div class="barras">
      <div class="col ingreso">
        <div class="pista"><div class="barra" id="barraIng"></div></div>
        <div class="total-wrap"><div class="total" id="totIng">$0</div></div>
        <div class="sub">Ingresos</div>
      </div>
      <div class="col gasto">
        <div class="pista"><div class="barra" id="barraGas"></div></div>
        <div class="total-wrap"><div class="total" id="totGas">$0</div></div>
        <div class="sub">Gastos</div>
      </div>
    </div>

    <div class="links">
      <button class="link-mov" id="abrirMov">Movimientos
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <button class="link-mov" id="abrirDeudas">Deudas
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>

  <!-- ========== DEUDAS ========== -->
  <section class="view" id="deudas" aria-hidden="true">
    <div class="top">
      <button class="back" id="cerrarDeudas">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2>Deudas</h2>
    </div>
    <div class="segmento dos" id="segDeudas" data-t="activas">
      <span class="indicador"></span>
      <button data-t="activas" class="on">Activas</button>
      <button data-t="cerradas">Cerradas</button>
    </div>
    <div class="acciones" id="accDeudas">
      <button class="pill debo" data-dt="debo">Debo</button>
      <button class="pill medeben" data-dt="medeben">Me deben</button>
    </div>
    <div class="lista-deudas" id="listaDeudas"></div>
  </section>

  <!-- ========== MOVIMIENTOS ========== -->
  <section class="view" id="movimientos" aria-hidden="true">
    <div class="top">
      <button class="back" id="cerrarMov">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
      </button>
      <h2>Movimientos</h2>
      <button class="btn-resp" id="abrirResp">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
        Respaldo
      </button>
    </div>
    <div class="segmento" id="segTipo" data-t="todos">
      <span class="indicador"></span>
      <button data-t="todos" class="on">Todos</button>
      <button data-t="ingreso">Ingresos</button>
      <button data-t="gasto">Gastos</button>
    </div>
    <div class="chips-wrap" id="chipsWrap"><div><div class="chips" id="chips"></div></div></div>
    <div class="lista-wrap">
      <div class="lista" id="lista"></div>
      <div class="resumen" id="resumen">
        <div class="txt"><b id="resTitulo"></b><small id="resCuenta"></small></div>
        <div class="monto-res" id="resMonto"></div>
      </div>
    </div>
  </section>

  <!-- ========== HOJA: NUEVO MOVIMIENTO ========== -->
  <div class="velo" id="velo"></div>
  <form class="hoja" id="hojaForm" autocomplete="off">
    <div class="agarre"></div>
    <h3 id="tituloForm">Nuevo ingreso</h3>
    <label class="campo">
      <span>Categoría</span>
      <div class="select-wrap">
        <select id="inCategoria"></select>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </div>
    </label>
    <label class="campo">
      <span>Nombre <em class="opc" id="opcNombre">(opcional)</em></span>
      <input id="inNombre" type="text" maxlength="40" placeholder="Ej. Pago de noviembre" enterkeyhint="next">
      <small class="pista-nombre" id="pistaNombre"></small>
    </label>
    <label class="campo monto">
      <span>Monto ($)</span>
      <input id="inMonto" type="text" inputmode="decimal" placeholder="0.00" enterkeyhint="done">
    </label>
    <div class="error" id="errForm"></div>
    <div class="botones">
      <button type="button" class="btn sec" id="cancelarForm">Cancelar</button>
      <button type="submit" class="btn verde" id="guardarForm">Guardar</button>
    </div>
  </form>

  <!-- ========== HOJA: BORRAR MOVIMIENTO ========== -->
  <div class="hoja" id="hojaBorrar">
    <div class="agarre"></div>
    <h3 id="tituloBorrar">¿Eliminar movimiento?</h3>
    <p class="det" id="detBorrar"></p>
    <div class="aviso" id="avisoBorrar" hidden>Esta acción no se puede deshacer. El monto se quitará de tus totales.</div>
    <div class="botones">
      <button type="button" class="btn sec" id="cancelarBorrar">Cancelar</button>
      <button type="button" class="btn rojo" id="confirmarBorrar">Eliminar</button>
    </div>
  </div>

  <!-- ========== HOJA: RESPALDO ========== -->
  <div class="hoja" id="hojaResp">
    <div class="agarre"></div>
    <h3>Respaldo</h3>
    <button class="opcion" id="btnExportar">
      <span class="ico v"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></span>
      <span><b>Exportar respaldo</b><small>Crea un archivo con tus movimientos y deudas. Guárdalo en Archivos, iCloud o envíatelo por WhatsApp.</small></span>
    </button>
    <button class="opcion" id="btnImportar">
      <span class="ico a"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg></span>
      <span><b>Importar respaldo</b><small>Recupera tus movimientos y deudas desde un archivo. No se duplican los que ya tienes.</small></span>
    </button>
    <input type="file" id="inArchivo" accept=".json,application/json,text/plain" hidden>
    <div class="ultimo" id="ultimoResp"></div>
    <button type="button" class="btn sec full" id="cerrarResp">Cerrar</button>
  </div>

  <!-- ========== HOJA: CONFIRMAR IMPORTACIÓN ========== -->
  <div class="hoja" id="hojaImport">
    <div class="agarre"></div>
    <h3>¿Importar respaldo?</h3>
    <p class="det" id="detImport"></p>
    <div class="botones">
      <button type="button" class="btn sec" id="cancelarImport">Cancelar</button>
      <button type="button" class="btn verde" id="confirmarImport">Importar</button>
    </div>
  </div>

  <!-- ========== HOJA: NUEVA DEUDA ========== -->
  <form class="hoja" id="hojaDeudaForm" autocomplete="off">
    <div class="agarre"></div>
    <h3 id="tituloDeuda">Debo</h3>
    <label class="campo">
      <span>Nombre <em class="opc req">(obligatorio)</em></span>
      <input id="dNombre" type="text" maxlength="40" placeholder="Ej. Préstamo, Cena, Pasaje…" enterkeyhint="next">
    </label>
    <label class="campo">
      <span id="lblPersona">¿A quién le debes?</span>
      <input id="dPersona" type="text" maxlength="30" placeholder="Nombre de la persona" enterkeyhint="next">
    </label>
    <label class="campo monto">
      <span>Monto ($)</span>
      <input id="dMonto" type="text" inputmode="decimal" placeholder="0.00" enterkeyhint="done">
    </label>
    <div class="info-deuda" id="infoDeuda"></div>
    <div class="error" id="errDeuda"></div>
    <div class="botones">
      <button type="button" class="btn sec" id="cancelarDeuda">Cancelar</button>
      <button type="submit" class="btn rojo" id="guardarDeuda">Guardar</button>
    </div>
  </form>

  <!-- ========== HOJA: DETALLE DE DEUDA ========== -->
  <div class="hoja" id="hojaDeuda">
    <div class="agarre"></div>
    <h3 id="detDeudaTitulo"></h3>
    <div class="fichas" id="detDeudaFichas"></div>
    <div class="aviso" id="detDeudaAviso" hidden></div>
    <div id="detDeudaGasto" hidden>
      <label class="campo monto">
        <span>¿Cuánto gastaste de este préstamo?</span>
        <input id="dGastado" type="text" inputmode="decimal" placeholder="0.00" enterkeyhint="done">
      </label>
      <small class="pista-nombre" id="pistaGasto"></small>
      <div class="error" id="errGasto" style="margin-top:6px"></div>
      <div class="botones">
        <button type="button" class="btn sec" id="btnCancelarGasto">Cancelar</button>
        <button type="button" class="btn rojo" id="btnContinuarGasto">Continuar</button>
      </div>
    </div>
    <div class="acciones-deuda" id="detDeudaPaso1">
      <button type="button" class="btn full" id="btnSaldar"></button>
      <div class="fila">
        <button type="button" class="btn sec borrar-deuda" id="btnBorrarDeuda">Eliminar</button>
        <button type="button" class="btn sec" id="btnCerrarDeuda">Cerrar</button>
      </div>
    </div>
    <div class="botones" id="detDeudaPaso2" hidden>
      <button type="button" class="btn sec" id="btnCancelarPaso2">Cancelar</button>
      <button type="button" class="btn" id="btnConfirmarPaso2"></button>
    </div>
  </div>

  <div class="toast" id="toast">Movimiento eliminado</div>

  <div class="update" id="avisoUpdate">
    <span>Nueva versión disponible</span>
    <button id="btnUpdate">Actualizar</button>
  </div>

<script>
(() => {
  /* ---------- Almacenamiento local (solo en este iPhone) ---------- */
  const KEY = 'wyt_movimientos_v1';
  let memoria = [];
  function cargar() {
    try { const d = JSON.parse(localStorage.getItem(KEY) || '[]'); return Array.isArray(d) ? d : []; }
    catch (e) { return memoria; }
  }
  function guardar(lista) {
    memoria = lista;
    try { localStorage.setItem(KEY, JSON.stringify(lista)); } catch (e) {}
  }
  let movs = cargar();

  /* ---------- Utilidades ---------- */
  const $ = id => document.getElementById(id);
  const fmt = n => {
    const abs = Math.abs(n);
    const s = abs.toLocaleString('en-US', { minimumFractionDigits: abs % 1 ? 2 : 0, maximumFractionDigits: 2 });
    return (n < 0 ? '-$' : '$') + s;
  };
  const fmtFecha = ts => {
    const d = new Date(ts);
    const dia = d.toLocaleDateString('es-PE', { day: 'numeric', month: 'short' }).replace('.', '');
    const hora = d.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit', hour12: false });
    return `${dia} · ${hora}`;
  };
  const esc = s => s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- Pintar pantalla de inicio ---------- */
  function pintarInicio() {
    const ing = movs.filter(m => m.tipo === 'ingreso').reduce((a, m) => a + m.monto, 0);
    const gas = movs.filter(m => m.tipo === 'gasto').reduce((a, m) => a + m.monto, 0);
    const dif = Math.round((ing - gas) * 100) / 100;

    $('lblBalance').textContent = dif < 0 ? 'Pérdida' : 'Ganancia';
    const mb = $('montoBalance');
    mb.textContent = fmt(dif);
    mb.className = 'monto ' + (dif < 0 ? 'neg' : 'pos');

    $('totIng').textContent = fmt(ing);
    $('totGas').textContent = fmt(gas);

    // La barra mayor ocupa el 100% de su espacio; la otra es proporcional (nunca se sale)
    const max = Math.max(ing, gas);
    const pct = v => max > 0 ? (v / max) * 100 : 0;
    $('barraIng').style.height = pct(ing) + '%';
    $('barraGas').style.height = pct(gas) + '%';

    ajustarTextos();
  }

  /* ---------- Achicar montos grandes para que entren en el ancho ---------- */
  function ajustar(el, maxPx) {
    el.style.fontSize = maxPx + 'px';
    const disponible = el.parentElement.clientWidth - 4;
    const real = el.scrollWidth;
    if (real > disponible && disponible > 0) el.style.fontSize = Math.floor(maxPx * disponible / real) + 'px';
  }
  function ajustarTextos() {
    ajustar($('montoBalance'), Math.min(84, Math.round(window.innerWidth * 0.2)));
    ajustar($('totIng'), 22);
    ajustar($('totGas'), 22);
  }

  /* ---------- Pintar lista de movimientos ---------- */
  /* Filtros: tipo (todos / ingreso / gasto) + categoría opcional */
  let fTipo = 'todos', fCat = null;

  function pintarFiltros() {
    const seg = $('segTipo');
    seg.dataset.t = fTipo;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === fTipo));
    const wrap = $('chipsWrap'), chips = $('chips');
    if (fTipo === 'todos') { wrap.classList.remove('on'); return; }
    const delTipo = movs.filter(m => m.tipo === fTipo);
    const cats = CATEGORIAS[fTipo].concat('Deuda');
    const x = chips.dataset.t === fTipo ? chips.scrollLeft : 0;
    chips.className = 'chips ' + fTipo; chips.dataset.t = fTipo;
    chips.innerHTML =
      `<button class="chip ${fCat === null ? 'on' : ''}" data-c="">Todas <span class="n">${delTipo.length}</span></button>` +
      cats.map(c => {
        const n = delTipo.filter(m => m.categoria === c).length;
        return `<button class="chip ${fCat === c ? 'on' : ''} ${n ? '' : 'cero'}" data-c="${c}">${c} <span class="n">${n}</span></button>`;
      }).join('');
    chips.scrollLeft = x;
    wrap.classList.add('on');
  }

  function pintarResumen(lista) {
    const r = $('resumen');
    if (fTipo === 'todos') { r.className = 'resumen'; return; }
    const total = lista.reduce((a, m) => a + m.monto, 0);
    const ing = fTipo === 'ingreso';
    $('resTitulo').textContent = fCat ? `Total ${fCat}` : (ing ? 'Total ingresos' : 'Total gastos');
    $('resCuenta').textContent = `${lista.length} movimiento${lista.length === 1 ? '' : 's'}`;
    const m = $('resMonto');
    m.textContent = ing ? fmt(total) : fmt(-total);
    m.className = 'monto-res ' + (ing ? 'pos' : 'neg');
    r.className = 'resumen on ' + fTipo;
  }

  function pintarLista() {
    const cont = $('lista');
    pintarFiltros();
    const lista = movs.filter(m => (fTipo === 'todos' || m.tipo === fTipo) && (fCat === null || m.categoria === fCat));
    pintarResumen(lista);
    if (!movs.length) {
      cont.innerHTML = '<div class="vacio">Aún no hay movimientos.<br>Registra un ingreso o un gasto desde el inicio.</div>';
      return;
    }
    if (!lista.length) {
      const que = fCat ? `en «${esc(fCat)}»` : (fTipo === 'ingreso' ? 'de ingresos' : 'de gastos');
      cont.innerHTML = `<div class="vacio">No hay movimientos ${que}.</div>`;
      return;
    }
    cont.innerHTML = [...lista].sort((a, b) => b.fecha - a.fecha).map(m => `
      <div class="item" data-id="${m.id}">
        <div class="info">
          <div class="nombre">${esc(m.nombre)}</div>
          <div class="meta"><span class="tag ${m.tipo}">${m.tipo === 'ingreso' ? 'Ingreso' : 'Gasto'}</span><span class="fecha">${m.categoria && m.categoria !== m.nombre ? esc(m.categoria) + ' · ' : ''}${fmtFecha(m.fecha)}</span></div>
        </div>
        <div class="valor ${m.tipo === 'ingreso' ? 'pos' : 'neg'}">${m.tipo === 'ingreso' ? '+' : '-'}${fmt(m.monto)}</div>
        <button class="borrar" aria-label="Eliminar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
        </button>
      </div>`).join('');
  }

  $('segTipo').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.t === fTipo) return;
    fTipo = b.dataset.t; fCat = null; pintarLista(); $('lista').scrollTop = 0;
  });
  $('chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    fCat = b.dataset.c || null; pintarLista(); $('lista').scrollTop = 0;
    const on = $('chips').querySelector('.chip.on');
    on && on.scrollIntoView({ behavior: 'smooth', inline: 'nearest', block: 'nearest' });
  });

  /* ---------- Navegación ---------- */
  function abrirVista(id) { $('inicio').classList.add('off'); $(id).classList.add('on'); }
  function cerrarVista(id) { $('inicio').classList.remove('off'); $(id).classList.remove('on'); }
  $('abrirMov').onclick = () => { pintarLista(); abrirVista('movimientos'); };
  $('cerrarMov').onclick = () => cerrarVista('movimientos');
  $('abrirDeudas').onclick = () => { pintarDeudas(); abrirVista('deudas'); };
  $('cerrarDeudas').onclick = () => cerrarVista('deudas');

  /* ---------- Hojas inferiores ---------- */
  let hojaAbierta = null;
  function abrirHoja(el) { hojaAbierta = el; $('velo').classList.add('on'); el.classList.add('on'); }
  function cerrarHoja() {
    if (!hojaAbierta) return;
    document.activeElement && document.activeElement.blur();
    hojaAbierta.classList.remove('on'); $('velo').classList.remove('on'); hojaAbierta = null;
  }
  $('velo').onclick = cerrarHoja;

  /* ---------- Formulario Ingreso / Gasto ---------- */
  const CATEGORIAS = {
    ingreso: ['Sueldo', 'Segundo sueldo', 'Otros'],
    gasto: ['Housing', 'Super', 'Comida', 'Entretenimiento', 'Ropa', 'Otros']
  };
  let tipoActual = 'ingreso';

  // Mensaje bajo el nombre según la categoría elegida
  function pintarPista() {
    const cat = $('inCategoria').value;
    $('inCategoria').classList.toggle('sin-valor', !cat);
    const otros = cat === 'Otros';
    $('opcNombre').textContent = otros ? '(obligatorio)' : '(opcional)';
    $('opcNombre').classList.toggle('req', otros);
    $('pistaNombre').textContent = otros
      ? 'Con «Otros» debes escribir un nombre.'
      : cat ? `Si no escribes un nombre, se guardará como «${cat}».`
            : 'Si no escribes un nombre, se guardará con el de la categoría.';
    if ($('errForm').textContent) $('errForm').textContent = '';
  }
  $('inCategoria').addEventListener('change', pintarPista);

  document.querySelectorAll('.pill').forEach(b => b.onclick = () => {
    tipoActual = b.dataset.tipo;
    $('tituloForm').textContent = tipoActual === 'ingreso' ? 'Nuevo ingreso' : 'Nuevo gasto';
    $('inCategoria').innerHTML = '<option value="" disabled selected>Elige una categoría</option>' +
      CATEGORIAS[tipoActual].map(c => `<option value="${c}">${c}</option>`).join('');
    $('guardarForm').className = 'btn ' + (tipoActual === 'ingreso' ? 'verde' : 'rojo');
    $('inNombre').value = ''; $('inMonto').value = ''; $('errForm').textContent = '';
    pintarPista();
    abrirHoja($('hojaForm'));
  });
  $('cancelarForm').onclick = cerrarHoja;
  $('inNombre').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('inMonto').focus(); } });

  $('hojaForm').addEventListener('submit', e => {
    e.preventDefault();
    const categoria = $('inCategoria').value;
    if (!categoria) { $('errForm').textContent = 'Elige una categoría.'; return; }
    const escrito = $('inNombre').value.trim();
    if (categoria === 'Otros' && !escrito) { $('errForm').textContent = 'Con «Otros» el nombre es obligatorio.'; $('inNombre').focus(); return; }
    const nombre = escrito || categoria;
    const monto = parseFloat($('inMonto').value.replace(/[^0-9.,]/g, '').replace(',', '.'));
    if (!(monto > 0)) { $('errForm').textContent = 'Escribe un monto mayor a 0.'; return; }
    if (monto > 999999999999) { $('errForm').textContent = 'El monto es demasiado grande.'; return; }
    movs.push({ id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), tipo: tipoActual, categoria, nombre, monto: Math.round(monto * 100) / 100, fecha: Date.now() });
    guardar(movs);
    cerrarHoja();
    pintarInicio();
  });

  /* ---------- Eliminar con doble verificación ---------- */
  let idBorrar = null, paso = 1;
  function pasoBorrar(n) {
    paso = n;
    $('tituloBorrar').textContent = n === 1 ? '¿Eliminar movimiento?' : '¿Estás seguro?';
    $('avisoBorrar').hidden = n === 1;
    $('confirmarBorrar').textContent = n === 1 ? 'Eliminar' : 'Sí, eliminar';
  }
  $('lista').addEventListener('click', e => {
    const it = e.target.closest('.item'); if (!it) return;
    const m = movs.find(x => x.id === it.dataset.id); if (!m) return;
    idBorrar = m.id;
    $('detBorrar').textContent = `${m.tipo === 'ingreso' ? 'Ingreso' : 'Gasto'} · ${m.nombre} · ${fmt(m.monto)}`;
    pasoBorrar(1);
    const ligada = m.deudaId && deudas.some(d => d.id === m.deudaId && d.estado !== 'cerrada');
    $('avisoBorrar').textContent = ligada
      ? 'Este movimiento es de una deuda pendiente. La deuda seguirá en Deudas; si quieres quitar todo, elimínala desde allí.'
      : 'Esta acción no se puede deshacer. El monto se quitará de tus totales.';
    abrirHoja($('hojaBorrar'));
  });
  $('cancelarBorrar').onclick = cerrarHoja;
  $('confirmarBorrar').onclick = () => {
    if (paso === 1) { pasoBorrar(2); return; }        // 1ª confirmación → pide la 2ª
    movs = movs.filter(m => m.id !== idBorrar); guardar(movs);  // 2ª confirmación → borra
    cerrarHoja(); pintarLista(); pintarInicio();
    toast('Movimiento eliminado');
  };

  /* =================== DEUDAS =================== */
  /* Me deben: al crear → gasto; al cobrar → ingreso (mismo monto).
     Debo:     al crear → no afecta nada; al pagar → gasto solo por lo que se gastó del préstamo. */
  const KEY_DEUDAS = 'cuadre_deudas_v1';
  let memDeudas = [];
  function cargarDeudas() {
    try { const d = JSON.parse(localStorage.getItem(KEY_DEUDAS) || '[]'); return Array.isArray(d) ? d : []; }
    catch (e) { return memDeudas; }
  }
  function guardarDeudas() {
    memDeudas = deudas;
    try { localStorage.setItem(KEY_DEUDAS, JSON.stringify(deudas)); } catch (e) {}
  }
  let deudas = cargarDeudas();
  // Migración: los "Debo" activos creados con la lógica anterior tenían un ingreso; se quita.
  (() => {
    let cambio = false;
    deudas.forEach(d => {
      if (d.tipo === 'debo' && d.estado !== 'cerrada' && d.movId) {
        movs = movs.filter(m => m.id !== d.movId); delete d.movId; cambio = true;
      }
    });
    if (cambio) { guardar(movs); guardarDeudas(); }
  })();

  const nuevoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  const icoPersona = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>';
  const icoChev = '<svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
  const fmtDia = ts => new Date(ts).toLocaleDateString('es-PE', { day: 'numeric', month: 'short' }).replace('.', '');
  const parseMonto = v => parseFloat(String(v).replace(/[^0-9.,]/g, '').replace(',', '.'));
  const r2 = n => Math.round(n * 100) / 100;

  let vistaDeudas = 'activas';
  $('segDeudas').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.dataset.t === vistaDeudas) return;
    vistaDeudas = b.dataset.t; pintarDeudas(); $('listaDeudas').scrollTop = 0;
  });

  function pintarDeudas() {
    const seg = $('segDeudas'); seg.dataset.t = vistaDeudas;
    seg.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === vistaDeudas));
    const activas = vistaDeudas === 'activas';
    $('accDeudas').hidden = !activas;
    const cont = $('listaDeudas');
    const sec = (tipo, titulo) => {
      const lista = deudas.filter(d => d.tipo === tipo && (activas ? d.estado !== 'cerrada' : d.estado === 'cerrada'))
        .sort((a, b) => activas ? b.fecha - a.fecha : (b.fechaCierre || 0) - (a.fechaCierre || 0));
      const cls = tipo === 'debo' ? 'neg' : 'pos';
      let cab;
      if (activas) {
        const total = lista.reduce((a, d) => a + d.monto, 0);
        cab = lista.length ? `<b class="${cls}">${fmt(total)}</b>` : '';
      } else {
        cab = `<span class="cuenta">${lista.length} ${lista.length === 1 ? 'deuda' : 'deudas'}</span>`;
      }
      const vacio = activas
        ? (tipo === 'debo' ? 'No le debes a nadie 🎉' : 'Nadie te debe por ahora')
        : 'Aún no hay deudas cerradas';
      return `<div class="seccion"><span>${titulo}</span>${cab}</div>` +
        (lista.length ? lista.map(d => {
          let sub = esc(d.persona);
          if (!activas) {
            sub += ` <span class="estado">· pagada ${fmtDia(d.fechaCierre || d.fecha)}</span>`;
            if (d.tipo === 'debo' && d.gastado != null && d.gastado < d.monto) sub += ` <span class="estado">· gastaste ${fmt(d.gastado)}</span>`;
          }
          return `
          <div class="item deuda ${activas ? '' : 'cerrada'}" data-id="${d.id}">
            <div class="info">
              <div class="nombre">${esc(d.nombre)}</div>
              <div class="persona">${icoPersona}<span>${sub}</span></div>
            </div>
            <div class="valor ${cls}">${fmt(d.monto)}</div>
            ${icoChev}
          </div>`;
        }).join('') : `<div class="vacio-sec">${vacio}</div>`);
    };
    cont.innerHTML = sec('debo', 'Debo') + sec('medeben', 'Me deben');
  }

  /* ----- Nueva deuda ----- */
  let tipoDeuda = 'debo';
  document.querySelectorAll('[data-dt]').forEach(b => b.onclick = () => {
    tipoDeuda = b.dataset.dt;
    const debo = tipoDeuda === 'debo';
    $('tituloDeuda').textContent = debo ? 'Debo' : 'Me deben';
    $('lblPersona').textContent = debo ? '¿A quién le debes?' : '¿Quién te debe?';
    $('infoDeuda').textContent = debo
      ? 'No cambia tu ganancia. Cuando pagues, indicarás cuánto de este préstamo gastaste y solo eso se registrará como gasto.'
      : 'Se registrará como gasto (Deuda) en Movimientos. Cuando te paguen, se registrará como ingreso.';
    $('guardarDeuda').className = 'btn ' + (debo ? 'rojo' : 'verde');
    $('dNombre').value = ''; $('dPersona').value = ''; $('dMonto').value = ''; $('errDeuda').textContent = '';
    abrirHoja($('hojaDeudaForm'));
  });
  $('cancelarDeuda').onclick = cerrarHoja;
  $('dNombre').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('dPersona').focus(); } });
  $('dPersona').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('dMonto').focus(); } });

  $('hojaDeudaForm').addEventListener('submit', e => {
    e.preventDefault();
    const nombre = $('dNombre').value.trim();
    const persona = $('dPersona').value.trim();
    const monto = parseMonto($('dMonto').value);
    const err = t => { $('errDeuda').textContent = t; };
    if (!nombre) { err('Escribe un nombre para la deuda.'); $('dNombre').focus(); return; }
    if (!persona) { err(tipoDeuda === 'debo' ? 'Escribe a quién le debes.' : 'Escribe quién te debe.'); $('dPersona').focus(); return; }
    if (!(monto > 0)) { err('Escribe un monto mayor a 0.'); return; }
    if (monto > 999999999999) { err('El monto es demasiado grande.'); return; }
    const m = r2(monto);
    const d = { id: nuevoId(), tipo: tipoDeuda, estado: 'activa', nombre, persona, monto: m, fecha: Date.now() };
    if (tipoDeuda === 'medeben') {
      const mov = { id: nuevoId(), tipo: 'gasto', categoria: 'Deuda', nombre: `${nombre} · ${persona}`, monto: m, fecha: Date.now(), deudaId: d.id };
      d.movId = mov.id; movs.push(mov); guardar(movs);
    }
    deudas.push(d); guardarDeudas();
    cerrarHoja(); pintarDeudas(); pintarInicio();
    toast(tipoDeuda === 'debo' ? 'Deuda registrada' : 'Deuda registrada · +gasto');
  });

  /* ----- Detalle de una deuda ----- */
  let deudaSel = null, accion = null, gastado = null;
  function detallePaso(n) {             // 1: opciones · 'g': cuánto gastaste · 2: confirmación
    $('detDeudaPaso1').hidden = n !== 1;
    $('detDeudaGasto').hidden = n !== 'g';
    $('detDeudaPaso2').hidden = n !== 2;
    $('detDeudaAviso').hidden = n !== 2;
  }
  $('listaDeudas').addEventListener('click', e => {
    const it = e.target.closest('.item.deuda'); if (!it) return;
    const d = deudas.find(x => x.id === it.dataset.id); if (!d) return;
    deudaSel = d; accion = null; gastado = null;
    const debo = d.tipo === 'debo', cerrada = d.estado === 'cerrada';
    $('detDeudaTitulo').textContent = d.nombre;
    let fichas = `
      <div class="ficha"><span>Tipo</span><b class="${debo ? 'neg' : 'pos'}">${debo ? 'Debo' : 'Me deben'}</b></div>
      <div class="ficha"><span>${debo ? 'Le debo a' : 'Me debe'}</span><b>${esc(d.persona)}</b></div>
      <div class="ficha"><span>Monto</span><b>${fmt(d.monto)}</b></div>
      <div class="ficha"><span>Desde</span><b>${fmtFecha(d.fecha)}</b></div>`;
    if (cerrada) {
      fichas += `<div class="ficha"><span>${debo ? 'Pagada' : 'Me pagaron'}</span><b>${fmtFecha(d.fechaCierre || d.fecha)}</b></div>`;
      if (debo && d.gastado != null) {
        fichas += `<div class="ficha"><span>Gastado del préstamo</span><b class="neg">${fmt(d.gastado)}</b></div>`;
        if (d.gastado < d.monto) fichas += `<div class="ficha"><span>Devuelto sin usar</span><b>${fmt(r2(d.monto - d.gastado))}</b></div>`;
      }
    }
    $('detDeudaFichas').innerHTML = fichas;
    $('btnSaldar').hidden = cerrada;
    $('btnSaldar').textContent = debo ? '✓ Ya pagué' : '✓ Ya me pagaron';
    $('btnSaldar').className = 'btn full ' + (debo ? 'rojo' : 'verde');
    $('btnBorrarDeuda').textContent = cerrada ? 'Quitar del historial' : 'Eliminar';
    detallePaso(1);
    abrirHoja($('hojaDeuda'));
  });
  $('btnCerrarDeuda').onclick = cerrarHoja;
  $('btnCancelarPaso2').onclick = () => detallePaso(1);
  $('btnCancelarGasto').onclick = () => detallePaso(1);

  function confirmarSaldo() {
    const d = deudaSel, debo = d.tipo === 'debo';
    accion = 'saldar';
    $('detDeudaAviso').className = 'aviso ok';
    if (debo) {
      const devuelto = r2(d.monto - gastado);
      $('detDeudaAviso').textContent = `¿Confirmas que ya le pagaste ${fmt(d.monto)} a ${d.persona}? ` +
        (gastado > 0 ? `Se registrará un gasto de ${fmt(gastado)} en Movimientos` : 'No se registrará ningún gasto') +
        (devuelto > 0 && gastado > 0 ? ` (los otros ${fmt(devuelto)} los devolviste sin usar).` : '.') +
        ' La deuda pasará a Cerradas.';
    } else {
      $('detDeudaAviso').textContent = `¿Confirmas que ${d.persona} ya te pagó ${fmt(d.monto)}? Se registrará un ingreso de ${fmt(d.monto)} en Movimientos y la deuda pasará a Cerradas.`;
    }
    $('btnConfirmarPaso2').textContent = debo ? 'Sí, ya pagué' : 'Sí, ya me pagaron';
    $('btnConfirmarPaso2').className = 'btn ' + (debo ? 'rojo' : 'verde');
    detallePaso(2);
  }

  $('btnSaldar').onclick = () => {
    const d = deudaSel; if (!d) return;
    if (d.tipo === 'debo') {
      // Primero: ¿cuánto de este préstamo gastaste? (por defecto, todo)
      $('dGastado').value = String(d.monto);
      $('pistaGasto').textContent = `Por defecto es el total (${fmt(d.monto)}). Si te dieron efectivo y devolviste una parte sin usarla, pon solo lo que gastaste.`;
      $('errGasto').textContent = '';
      detallePaso('g');
    } else {
      confirmarSaldo();
    }
  };
  $('btnContinuarGasto').onclick = () => {
    const d = deudaSel; if (!d) return;
    const raw = $('dGastado').value.trim();
    const g = raw === '' ? NaN : parseMonto(raw);
    if (!(g >= 0)) { $('errGasto').textContent = 'Escribe cuánto gastaste (puede ser 0).'; return; }
    if (g > d.monto) { $('errGasto').textContent = `No puede ser mayor que la deuda (${fmt(d.monto)}).`; return; }
    gastado = r2(g);
    document.activeElement && document.activeElement.blur();
    confirmarSaldo();
  };
  $('dGastado').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); $('btnContinuarGasto').click(); } });

  $('btnBorrarDeuda').onclick = () => {
    const d = deudaSel; if (!d) return; accion = 'borrar';
    $('detDeudaAviso').className = 'aviso';
    if (d.estado === 'cerrada') {
      $('detDeudaAviso').textContent = '¿Quitar esta deuda del historial? Tus movimientos no cambian.';
      $('btnConfirmarPaso2').textContent = 'Sí, quitar';
    } else {
      const tieneMov = d.movId && movs.some(m => m.id === d.movId);
      $('detDeudaAviso').textContent = '¿Eliminar esta deuda? No se puede deshacer.' +
        (tieneMov ? ` También se quitará el gasto de ${fmt(d.monto)} que se registró al crearla.` : '');
      $('btnConfirmarPaso2').textContent = 'Sí, eliminar';
    }
    $('btnConfirmarPaso2').className = 'btn rojo';
    detallePaso(2);
  };

  $('btnConfirmarPaso2').onclick = () => {
    const d = deudaSel; if (!d || !accion) return;
    if (accion === 'saldar') {
      const debo = d.tipo === 'debo';
      if (debo) {
        if (gastado > 0) movs.push({ id: nuevoId(), tipo: 'gasto', categoria: 'Deuda', nombre: `${d.nombre} · ${d.persona}`, monto: gastado, fecha: Date.now(), deudaId: d.id });
        d.gastado = gastado;
      } else {
        movs.push({ id: nuevoId(), tipo: 'ingreso', categoria: 'Deuda', nombre: `${d.nombre} · ${d.persona}`, monto: d.monto, fecha: Date.now(), deudaId: d.id });
      }
      guardar(movs);
      d.estado = 'cerrada'; d.fechaCierre = Date.now();
      toast(debo ? (gastado > 0 ? `Deuda pagada · gasto ${fmt(gastado)}` : 'Deuda pagada') : 'Te pagaron · +ingreso');
    } else if (d.estado === 'cerrada') {
      deudas = deudas.filter(x => x.id !== d.id);
      toast('Quitada del historial');
    } else {
      if (d.movId) { movs = movs.filter(m => m.id !== d.movId); guardar(movs); }
      deudas = deudas.filter(x => x.id !== d.id);
      toast('Deuda eliminada');
    }
    guardarDeudas();
    deudaSel = null; accion = null; gastado = null;
    cerrarHoja(); pintarDeudas(); pintarInicio();
  };

  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('on'), 2200);
  }

  /* ---------- Respaldo: exportar / importar ---------- */
  const KEY_RESP = 'wyt_ultimo_respaldo';
  function pintarUltimo() {
    let ts = 0; try { ts = +localStorage.getItem(KEY_RESP) || 0; } catch (e) {}
    if (!ts) { $('ultimoResp').textContent = 'Aún no has hecho ningún respaldo.'; return; }
    const dias = Math.floor((Date.now() - ts) / 86400000);
    $('ultimoResp').textContent = 'Último respaldo: ' + (dias === 0 ? 'hoy' : dias === 1 ? 'ayer' : `hace ${dias} días`);
  }
  $('abrirResp').onclick = () => { pintarUltimo(); abrirHoja($('hojaResp')); };
  $('cerrarResp').onclick = cerrarHoja;

  $('btnExportar').onclick = async () => {
    if (!movs.length && !deudas.length) { toast('No hay datos para respaldar'); return; }
    const hoy = new Date();
    const f = `${hoy.getFullYear()}-${String(hoy.getMonth() + 1).padStart(2, '0')}-${String(hoy.getDate()).padStart(2, '0')}`;
    const nombre = `Cuadre-respaldo-${f}.json`;
    const datos = JSON.stringify({ app: 'Cuadre', version: 2, exportado: Date.now(), movimientos: movs, deudas }, null, 1);
    const marcar = () => { try { localStorage.setItem(KEY_RESP, String(Date.now())); } catch (e) {} pintarUltimo(); };
    try {
      const file = new File([datos], nombre, { type: 'application/json' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Respaldo Cuadre' });
        marcar(); toast('Respaldo exportado'); return;
      }
    } catch (e) {
      if (e && e.name === 'AbortError') return; // el usuario cerró el menú
    }
    try { // alternativa: descarga directa
      const url = URL.createObjectURL(new Blob([datos], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = nombre;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 4000);
      marcar(); toast('Respaldo exportado');
    } catch (e) { toast('No se pudo exportar'); }
  };

  let pendientes = null, deudasPend = [];
  $('btnImportar').onclick = () => { $('inArchivo').value = ''; $('inArchivo').click(); };
  $('inArchivo').addEventListener('change', async () => {
    const file = $('inArchivo').files[0]; if (!file) return;
    try {
      const d = JSON.parse(await file.text());
      const lista = Array.isArray(d) ? d : (d.movimientos || []);
      if (!Array.isArray(lista)) throw 0;
      const dVal = (Array.isArray(d.deudas) ? d.deudas : []).filter(x => x && x.id && (x.tipo === 'debo' || x.tipo === 'medeben') && typeof x.nombre === 'string' && typeof x.persona === 'string' && +x.monto > 0)
        .map(x => ({ id: String(x.id), tipo: x.tipo, nombre: x.nombre.slice(0, 40), persona: x.persona.slice(0, 30), monto: Math.round(+x.monto * 100) / 100, fecha: +x.fecha || Date.now(), movId: x.movId ? String(x.movId) : undefined,
          estado: x.estado === 'cerrada' ? 'cerrada' : 'activa', fechaCierre: +x.fechaCierre || undefined, gastado: x.gastado != null ? r2(+x.gastado) : undefined }));
      const dIds = new Set(deudas.map(x => x.id));
      deudasPend = dVal.filter(x => !dIds.has(x.id));
      const validos = lista.filter(m => m && (m.tipo === 'ingreso' || m.tipo === 'gasto') && typeof m.nombre === 'string' && +m.monto > 0 && m.id)
        .map(m => ({ id: String(m.id), tipo: m.tipo, categoria: typeof m.categoria === 'string' ? m.categoria.slice(0, 30) : undefined, nombre: m.nombre.slice(0, 40), monto: Math.round(+m.monto * 100) / 100, fecha: +m.fecha || Date.now(), deudaId: m.deudaId ? String(m.deudaId) : undefined }));
      if (!validos.length && !dVal.length) throw 0;
      const ids = new Set(movs.map(m => m.id));
      pendientes = validos.filter(m => !ids.has(m.id));
      if (!pendientes.length && !deudasPend.length) { cerrarHoja(); toast('Ya tienes todos esos datos'); return; }
      const pl = (n, a, b) => `${n} ${n === 1 ? a : b}`;
      const partes = [];
      if (pendientes.length) partes.push(pl(pendientes.length, 'movimiento', 'movimientos'));
      if (deudasPend.length) partes.push(pl(deudasPend.length, 'deuda', 'deudas'));
      $('detImport').textContent = `Se añadirán ${partes.join(' y ')} que no tienes. Lo que ya tienes se mantiene.`;
      cerrarHoja();
      setTimeout(() => abrirHoja($('hojaImport')), 280);
    } catch (e) {
      cerrarHoja(); toast('Ese archivo no es un respaldo válido');
    }
  });
  $('cancelarImport').onclick = () => { pendientes = null; cerrarHoja(); };
  $('confirmarImport').onclick = () => {
    if (!pendientes) return;
    movs = movs.concat(pendientes); guardar(movs);
    deudas = deudas.concat(deudasPend); guardarDeudas();
    pendientes = null; deudasPend = [];
    cerrarHoja(); pintarLista(); pintarDeudas(); pintarInicio();
    toast('Respaldo importado');
  };

  /* ---------- Arranque ---------- */
  window.addEventListener('resize', ajustarTextos);
  window.addEventListener('pageshow', pintarInicio);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) pintarInicio(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajustarTextos);
  pintarInicio();
  requestAnimationFrame(pintarInicio);

  /* ---------- Pedir al iPhone que no borre los datos ---------- */
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist().catch(() => {}); } catch (e) {}

  /* ---------- Copia guardada + aviso de nueva versión ---------- */
  try {
    if ('serviceWorker' in navigator) {
      let recargando = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (recargando) return; recargando = true; location.reload();
      });
      navigator.serviceWorker.register('sw.js').then(reg => {
        const mostrar = w => {
          if (!w || !navigator.serviceWorker.controller) return; // primera instalación: nada que avisar
          $('avisoUpdate').classList.add('on');
          $('btnUpdate').onclick = () => { $('btnUpdate').textContent = '…'; w.postMessage('ACTIVAR'); };
        };
        if (reg.waiting) mostrar(reg.waiting);
        reg.addEventListener('updatefound', () => {
          const nw = reg.installing;
          nw && nw.addEventListener('statechange', () => { if (nw.state === 'installed') mostrar(nw); });
        });
        // Revisar si hay versión nueva cada vez que se vuelve a la app
        document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
      }).catch(() => {});
    }
  } catch (e) {}
})();
</script>
</body>
</html>
